name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A deploy that races another deploy can publish an older build over a newer one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Fixtures are generated, never committed as opaque blobs a reviewer
      # cannot audit. Regenerating them here proves the committed samples still
      # match the documented layout in make.mjs.
      - name: Rebuild fixtures
        run: for f in fixtures/*/make.mjs; do node "$f"; done

      - name: Fixtures are reproducible
        run: git diff --exit-code -- fixtures/

      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # Forensic software with a network call is not forensic software.
      - name: No network calls in shipped code
        run: |
          if grep -rnE '\b(fetch|XMLHttpRequest|WebSocket|sendBeacon|importScripts)\s*\(' src/ \
             --include='*.ts' --include='*.tsx' | grep -v '\.test\.'; then
            echo "::error::shipped code must not make network calls"
            exit 1
          fi

      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        with:
          path: dist

  # Only runs after every check above has passed, so a broken parser cannot go live.
  deploy:
    needs: check
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
